name: Deploy map to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # AI解説: リポジトリの secret に CLOUDFLARE_API_TOKEN があるときだけ Worker を公開する。
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # APIキーは GitHub の secret から Worker の secret へ直接渡し、ページ側には Worker の URL だけを渡す。
      # 失敗してもページの公開は続ける（その場合はボタンを出さないか、vars.AI_EXPLAIN_URL を使う）。
      - name: Deploy AI explain worker
        id: worker
        if: env.HAS_CLOUDFLARE == 'true'
        continue-on-error: true
        working-directory: ai-explain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          npm ci --no-audit --no-fund
          secrets="$RUNNER_TEMP/ai-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          args=()
          # Only the keys that are set are uploaded; keys left out keep their previous value in the Worker.
          if [ -n "$ANTHROPIC_API_KEY$GEMINI_API_KEY" ]; then
            node -e 'const e=process.env,o={};for(const k of ["ANTHROPIC_API_KEY","GEMINI_API_KEY"])if(e[k])o[k]=e[k];require("fs").writeFileSync(process.argv[1],JSON.stringify(o),{mode:0o600})' "$secrets"
            args=(--secrets-file "$secrets")
          fi
          # vars.AI_MODEL (optional) overrides the default model in wrangler.toml, e.g. to go back to Claude.
          if [ -n "$AI_MODEL" ]; then args+=(--var "MODEL:$AI_MODEL"); fi
          npx wrangler deploy "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/worker-deploy.log"
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/worker-deploy.log" | head -n 1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "AI解説 Worker: ${url:-（URL を読み取れませんでした）}"
      - run: npm run build
        env:
          # AI解説の Worker URL（公開してよい値）。上の手順で公開した URL を優先し、なければ Actions variables の値。
          AI_EXPLAIN_URL: ${{ steps.worker.outputs.url || vars.AI_EXPLAIN_URL }}
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
