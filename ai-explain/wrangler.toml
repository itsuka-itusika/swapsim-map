name = "swapsim-ai-explain"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# 呼び出しを許すページの Origin（カンマ区切り）
ALLOWED_ORIGINS = "https://itsuka-itusika.github.io,http://localhost:8000"
# 既定のモデル。GitHub の Actions variables の AI_MODEL を設定すると、公開時にそちらで上書きされる。
MODEL = "gemini-3.1-flash-lite:high"
# リクエストで選べるモデル（比較用）。ここにないモデルを指定されたら MODEL を使う。
# Gemini は「:low」「:medium」「:high」で考える量を指定できる（省略時は low）。
ALLOWED_MODELS = "claude-sonnet-5-5,gemini-3.1-flash-lite,gemini-3.1-flash-lite:medium,gemini-3.1-flash-lite:high,claude-haiku-5-5"
# 1日（日本時間）に新しく生成する解説の上限。キャッシュ済みの解説は数えない。
DAILY_LIMIT = "300"

# 解説のキャッシュと1日の生成数。id を書かないので、初回の `wrangler deploy` が自動で作り、以後は同じものを使う。
[[kv_namespaces]]
binding = "EXPLAIN_KV"

# 同じ IP からの生成は 1分に4回まで。
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 4, period = 60 }
